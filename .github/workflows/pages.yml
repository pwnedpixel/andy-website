name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Build production site
        run: npm run build

      - name: Prepare Pages files
        run: |
          cp CNAME dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Save production site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download production site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: dist/

      - name: Check Pages publishing source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pages_source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.source | "\(.branch):\(.path)"')
          if [[ "$pages_source" != 'gh-pages:/' ]]; then
            echo '::error::GitHub Pages must publish from the gh-pages branch at /(root). Check Settings > Pages.'
            exit 1
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/
          cname: www.akeech.com

      # A push made with GITHUB_TOKEN does not start a Pages build by itself.
      - name: Build and verify Pages publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_url=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.url')
          for attempt in {1..60}; do
            status=$(gh api "$build_url" --jq '.status')
            case "$status" in
              built) exit 0 ;;
              errored)
                gh api "$build_url" --jq '.error.message'
                exit 1
                ;;
            esac
            sleep 5
          done
          echo '::error::Timed out waiting for the GitHub Pages build.'
          exit 1
