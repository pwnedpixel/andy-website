<div class="section-title">Projects</div>
@if (projects(); as content) {
<mat-card>
    <div class="row">
        @for (project of content.projects; track project.title) {
        <div class="project-image-container col-xl-4 col-lg-6 col-sm-12">
            <div>{{ project.title }}</div>
            <img class="project-image" [src]="project.image" [alt]="project.title" />
            <div class="centered">
                <ul>
                    @for (item of project.info; track $index) {
                    <li>{{ item }}</li>
                    }
                </ul>
                <a [href]="project.link" target="_blank" class="btn btn-outline-light more-info-button">More Info</a>
            </div>
        </div>
        }
    </div>
</mat-card>
}
