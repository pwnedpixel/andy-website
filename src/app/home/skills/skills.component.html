<div class="skills">
    <div class="section-title">
        Skills
    </div>
    <div class="row">
        <div class="col-md-6">
            @for (skill of getSkills(0); track skill.name) {
            <div class="row">
                <div class="col-md-6 d-flex justify-content-lg-end">
                    {{skill.name}}
                </div>
                <div class="col-md-6">
                    @for (circle of skill.circles; track $index) {
                    <i class="fa-circle" [class.fa-solid]="circle === '1'" [class.fa-regular]="circle !== '1'"></i>
                    }
                </div>
            </div>
            }
        </div>
        <div class="col-md-6">
            @for (skill of getSkills(1); track skill.name) {
            <div class="row">
                <div class="col-md-6 d-flex justify-content-lg-end">
                    {{skill.name}}
                </div>
                <div class="col-md-6">
                    @for (circle of skill.circles; track $index) {
                    <i class="fa-circle" [class.fa-solid]="circle === '1'" [class.fa-regular]="circle !== '1'"></i>
                    }
                </div>
            </div>
            }
        </div>
    </div>
</div>
